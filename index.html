<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluaciones de Inglés - 1° Año (CABA)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            max-width: 520px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #334155;
        }
        .badge {
            display: inline-block;
            background: #334155;
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .exam-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            padding: 18px 24px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .exam-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .exam-btn span.arrow {
            font-size: 20px;
            opacity: 0.85;
        }
        .bim1 { background: #2563eb; }
        .bim1:hover { background: #1d4ed8; }

        .bim2 { background: #059669; }
        .bim2:hover { background: #047857; }

        .bim3 { background: #7e22ce; }
        .bim3:hover { background: #6b21a8; }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="badge">NES • CABA • 1.° AÑO</div>
    <h1>Evaluaciones de Inglés</h1>
    <p class="subtitle">Seleccioná el bimestre correspondiente para iniciar la evaluación (tiempo límite: 30 minutos).</p>

    <div class="btn-group">
        <a href="1bim1_2.html" class="exam-btn bim1">
            <span>1.º Bimestre</span>
            <span class="arrow">→</span>
        </a>

        <a href="1bim2_2.html" class="exam-btn bim2">
            <span>2.º Bimestre</span>
            <span class="arrow">→</span>
        </a>

        <a href="1bim3_2.html" class="exam-btn bim3">
            <span>3.º Bimestre</span>
            <span class="arrow">→</span>
        </a>
    </div>

    <footer>
        Recordá no salir de la pantalla completa durante el examen.
    </footer>
</div>

</body>
</html>
